name: Dependency security audit

on:
  push:
    branches:
      - main
      - "security/**"
      - "feature/**"
    paths:
      - "requirements*.txt"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "requirements*.txt"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security audit tool
        run: python -m pip install -r requirements-dev.txt

      - name: Audit production dependencies
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off
