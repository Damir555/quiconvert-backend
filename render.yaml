services:
  - type: keyvalue
    name: quiconvert-rate-limit
    plan: free
    ipAllowList: []

  - type: web
    name: quiconvert-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DAILY_LIMIT_FREE
        value: "5"
      - key: USAGE_TIMEZONE
        value: "Europe/Zagreb"
      - key: REQUIRE_SHARED_RATE_LIMIT
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: quiconvert-rate-limit
          property: connectionString
